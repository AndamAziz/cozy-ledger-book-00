<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <path d="M 80 120 L 432 120" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <path d="M 80 392 L 432 392" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  
  <text x="256" y="310" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="180" 
        font-weight="900" 
        text-anchor="middle" 
        fill="url(#textGradient)"
        filter="url(#shadow)"
        letter-spacing="-5">CTP</text>
  
  <rect x="156" y="330" width="200" height="6" rx="3" fill="#f59e0b" opacity="0.6"/>
</svg>
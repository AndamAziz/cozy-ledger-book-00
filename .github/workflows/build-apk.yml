name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Root of the Android Studio project (gradlew lives here).
  ANDROID_DIR: android

jobs:
  build:
    name: Debug + Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no Android project
        id: guard
        run: |
          if [ -f "$ANDROID_DIR/gradlew" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $ANDROID_DIR/gradlew found — nothing to build."
          fi

      - name: Set up JDK 17
        if: steps.guard.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.guard.outputs.found == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        if: steps.guard.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: steps.guard.outputs.found == 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: steps.guard.outputs.found == 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        if: steps.guard.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ---- Signed release ----
      # Add these repository secrets to enable signing:
      #   ANDROID_KEYSTORE_BASE64  -> base64 of your .jks  (base64 -w0 release.jks)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Without them the job still produces an unsigned release APK.
      - name: Decode keystore
        id: keystore
        if: steps.guard.outputs.found == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building an unsigned release APK."
          fi

      - name: Build Signed Release APK
        if: steps.guard.outputs.found == 'true' && steps.keystore.outputs.signed == 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build Unsigned Release APK
        if: steps.guard.outputs.found == 'true' && steps.keystore.outputs.signed != 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        if: steps.guard.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
